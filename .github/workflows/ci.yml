name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # weekly: catches newly disclosed vulnerabilities in the pinned set

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install pinned dependencies
        run: pip install -r requirements.lock
      - name: Compile all Python files
        run: python -m py_compile etl/*.py app/*.py app/lib/*.py app/pages/*.py
      # Includes the AppTest smoke tests, which render every Streamlit page against the committed CSVs.
      - name: Run tests
        run: pytest

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Audit pinned dependencies
        run: |
          pip install pip-audit
          pip-audit -r requirements.lock --no-deps --disable-pip
